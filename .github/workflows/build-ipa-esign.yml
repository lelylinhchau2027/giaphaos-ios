# Build IPA (unsigned) trên cloud Mac — không cần Mac local.
# Tải artifact → ESign trên iPhone ký & cài.
#
# Chạy: Actions → "Build IPA for ESign" → Run workflow

name: Build IPA for ESign

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL web app (Vercel)"
        required: true
        default: "https://giapha-os.homielab.com"
      supabase_url:
        description: "Supabase URL (tuỳ chọn — widget/thông báo)"
        required: false
        default: ""
      supabase_anon_key:
        description: "Supabase anon key (tuỳ chọn)"
        required: false
        default: ""
      bundle_id:
        description: "iOS Bundle ID"
        required: true
        default: "com.giaphaos.family"

concurrency:
  group: build-ipa-esign
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write build env
        run: |
          cat > .env << EOF
          EXPO_PUBLIC_WEB_URL=${{ inputs.web_url }}
          EXPO_PUBLIC_SUPABASE_URL=${{ inputs.supabase_url }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ inputs.supabase_anon_key }}
          EXPO_PUBLIC_SITE_NAME=Gia Phả OS
          IOS_BUNDLE_ID=${{ inputs.bundle_id }}
          EXPO_PUBLIC_APP_GROUP=group.${{ inputs.bundle_id }}
          EOF
          # Export for subsequent steps
          echo "EXPO_PUBLIC_WEB_URL=${{ inputs.web_url }}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ inputs.supabase_url }}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ inputs.supabase_anon_key }}" >> "$GITHUB_ENV"
          echo "IOS_BUNDLE_ID=${{ inputs.bundle_id }}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_APP_GROUP=group.${{ inputs.bundle_id }}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SITE_NAME=Gia Phả OS" >> "$GITHUB_ENV"

      - name: Expo prebuild (generate native ios/)
        run: npx expo prebuild -p ios --non-interactive --clean

      - name: CocoaPods install
        working-directory: ios
        run: |
          gem install cocoapods -N
          pod install --repo-update

      - name: Xcode build (unsigned, device arm64)
        working-directory: ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -1 *.xcworkspace | head -1)
          echo "Workspace: $WORKSPACE"

          echo "=== Schemes ==="
          xcodebuild -list -workspace "$WORKSPACE"

          # Ưu tiên scheme trùng tên app; fallback scheme đầu tiên không phải Pods
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | awk '
              /Schemes:/{f=1; next}
              f && NF {
                if ($1 != "Pods" && $1 !~ /Pods-/) { print $1; exit }
              }')
          if [[ -z "${SCHEME:-}" ]]; then
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
              | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          fi
          echo "Using scheme: $SCHEME"

          DERIVED="$RUNNER_TEMP/DerivedData"
          rm -rf "$DERIVED"
          mkdir -p "$DERIVED"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

          echo "DERIVED=$DERIVED" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          set -euo pipefail
          # App chính nằm trong Release-iphoneos (không lấy appex)
          APP_PATH=$(find "$DERIVED/Build/Products" -path "*Release-iphoneos/*.app" -type d ! -path "*.appex/*" | head -1)
          if [[ -z "${APP_PATH:-}" ]]; then
            echo "ERROR: không tìm thấy .app"
            find "$DERIVED/Build/Products" -maxdepth 4 -type d || true
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          ls -la "$APP_PATH"

          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"

          OUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT_DIR"
          (
            cd "$STAGE"
            zip -r -y "$OUT_DIR/GiaPhaOS-esign.ipa" Payload
          )
          ls -lh "$OUT_DIR/GiaPhaOS-esign.ipa"
          # sanity: IPA phải có binary
          unzip -l "$OUT_DIR/GiaPhaOS-esign.ipa" | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiaPhaOS-esign-ipa
          path: dist/GiaPhaOS-esign.ipa
          if-no-files-found: error
          retention-days: 30

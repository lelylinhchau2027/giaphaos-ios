# Build IPA (unsigned) trên cloud Mac — không cần Mac local.
# Tải artifact → ESign trên iPhone ký & cài.
#
# Chạy: Actions → "Build IPA for ESign" → Run workflow

name: Build IPA for ESign

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "(Không còn dùng cho UI native — có thể để mặc định)"
        required: false
        default: "https://giapha-os.homielab.com"
      supabase_url:
        description: "Supabase URL (BẮT BUỘC — nguồn dữ liệu app)"
        required: true
        default: ""
      supabase_anon_key:
        description: "Supabase anon key (BẮT BUỘC)"
        required: true
        default: ""
      bundle_id:
        description: "iOS Bundle ID"
        required: true
        default: "com.giaphaos.family"

concurrency:
  group: build-ipa-esign
  cancel-in-progress: true

jobs:
  build-ipa:
    # macos-14 default Xcode is 15.4 — RN 0.86 / Expo 57 require Xcode >= 16.1
    # macos-15 default is Xcode 16.4
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (Swift 6.2 / Xcode 26.x)
        run: |
          set -euo pipefail
          echo "=== Available Xcode apps ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          # expo-modules-jsi Package.swift requires swift-tools-version 6.2.
          # Xcode 16.4 ships Swift 6.1 → fails. Prefer Xcode 26.x (Swift 6.2).
          SELECTED=""
          for candidate in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode_26.app
          do
            if [[ -d "$candidate" ]]; then
              SELECTED="$candidate"
              break
            fi
          done
          if [[ -z "$SELECTED" ]]; then
            echo "ERROR: need Xcode 26.x (Swift 6.2) for expo-modules-jsi; none found"
            exit 1
          fi
          sudo xcode-select -s "$SELECTED"
          sudo xcodebuild -license accept 2>/dev/null || true
          echo "Selected: $(xcode-select -p)"
          xcodebuild -version
          swift --version || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          # expo-router peer tree needs legacy peer resolution on CI
          npm ci --legacy-peer-deps
          # postinstall runs patch-ios-deps.sh; re-run explicitly for clarity in logs
          bash scripts/patch-ios-deps.sh

      - name: Write build env
        run: |
          # EXPO_PUBLIC_APP_GROUP is intentionally NOT set here — app.config.js
          # has its own fixed, hard-to-collide default (not derived from
          # bundle_id). Overriding it per-bundle-id was the mechanism that
          # kept regenerating `group.<bundle_id>`, which risks colliding with
          # an App Group already registered under a different Apple ID.
          cat > .env << EOF
          EXPO_PUBLIC_WEB_URL=${{ inputs.web_url }}
          EXPO_PUBLIC_SUPABASE_URL=${{ inputs.supabase_url }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ inputs.supabase_anon_key }}
          EXPO_PUBLIC_SITE_NAME=Gia Phả OS
          IOS_BUNDLE_ID=${{ inputs.bundle_id }}
          EOF
          # Export for subsequent steps
          echo "EXPO_PUBLIC_WEB_URL=${{ inputs.web_url }}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ inputs.supabase_url }}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ inputs.supabase_anon_key }}" >> "$GITHUB_ENV"
          echo "IOS_BUNDLE_ID=${{ inputs.bundle_id }}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SITE_NAME=Gia Phả OS" >> "$GITHUB_ENV"
          echo "CI=1" >> "$GITHUB_ENV"

      - name: Expo prebuild (generate native ios/)
        env:
          CI: "1"
        run: npx expo prebuild -p ios --clean

      - name: CocoaPods install
        working-directory: ios
        run: |
          # CocoaPods is preinstalled on GitHub macOS images; only install if missing
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods -N
          fi
          pod --version
          pod install --repo-update

      - name: Xcode build (unsigned, device arm64)
        working-directory: ios
        run: |
          set -euo pipefail
          # .xcworkspace is a directory bundle — use find -type d (not bare ls)
          WORKSPACE=$(find . -maxdepth 1 -type d -name '*.xcworkspace' | head -1)
          WORKSPACE="${WORKSPACE#./}"
          if [[ -z "${WORKSPACE:-}" || ! -d "$WORKSPACE" ]]; then
            echo "ERROR: no .xcworkspace found in ios/"
            ls -la
            exit 1
          fi
          echo "Workspace: $WORKSPACE"

          echo "=== Schemes ==="
          SCHEME_LIST=$(xcodebuild -list -workspace "$WORKSPACE")
          echo "$SCHEME_LIST"

          # App scheme matches workspace name (GiaPhOS.xcworkspace → GiaPhOS).
          # Do NOT pick first scheme (that was EXApplication / a Pod).
          SCHEME="${WORKSPACE%.xcworkspace}"
          if ! echo "$SCHEME_LIST" | awk '/Schemes:/{f=1;next} f&&NF{print $1}' | grep -qx "$SCHEME"; then
            echo "WARN: scheme '$SCHEME' not in list; trying non-Pods / non-Expo fallbacks"
            SCHEME=$(echo "$SCHEME_LIST" | awk '
              /Schemes:/{f=1; next}
              f && NF {
                s=$1
                if (s ~ /^(Pods|EX|Expo|React|hermes|FB|RCT|RNC)/) next
                if (s ~ /-/) next
                print s; exit
              }')
          fi
          if [[ -z "${SCHEME:-}" ]]; then
            echo "ERROR: no suitable Xcode scheme"
            exit 1
          fi
          echo "Using scheme: $SCHEME"

          DERIVED="$RUNNER_TEMP/DerivedData"
          rm -rf "$DERIVED"
          mkdir -p "$DERIVED"

          # Stream full log + keep a compact error summary on failure
          set -o pipefail
          # Build hoàn toàn unsigned. Xcode/SDK iOS 26.2 đã BỎ hỗ trợ ký
          # "Ad Hoc" (CODE_SIGN_IDENTITY="-") cho build thiết bị iOS — dùng
          # giá trị đó làm build fail với lỗi "Ad Hoc code signing is not
          # allowed with SDK 'iOS 26.2'" trên mọi target (kể cả Pods).
          # ESign không cần binary được ký sẵn để biết app cần App Group —
          # nó đọc từ các file *.entitlements trong source project
          # (ios/GiaPhOS/GiaPhOS.entitlements,
          # ios/.targets/GiaPhaWidget/generated.entitlements), không phải
          # từ chữ ký nhúng trong .app/.appex lúc CI build.
          if ! xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          then
            echo "======== xcodebuild errors (filtered) ========"
            grep -E 'error:|fatal error:|BUILD FAILED|❌|SwiftCompile|clang: error' \
              "$RUNNER_TEMP/xcodebuild.log" | tail -80 || true
            exit 65
          fi

          echo "DERIVED=$DERIVED" >> "$GITHUB_ENV"

      - name: Verify entitlements (debug)
        run: |
          set -euo pipefail
          echo "=== Embedded signature (expected empty — build is unsigned) ==="
          for BUNDLE in $(find "$DERIVED/Build/Products" -maxdepth 3 -type d \( -name "*.app" -o -name "*.appex" \)); do
            echo "--- $BUNDLE ---"
            codesign -d --entitlements :- "$BUNDLE" 2>&1 || echo "(unsigned, as expected)"
          done
          echo ""
          echo "=== Source entitlements files (what ESign should grant) ==="
          find . -name "*.entitlements" -exec sh -c 'echo "--- {} ---"; cat "{}"; echo' \;

      - name: Package IPA
        run: |
          set -euo pipefail
          # App chính nằm trong Release-iphoneos (không lấy appex)
          APP_PATH=$(find "$DERIVED/Build/Products" -path "*Release-iphoneos/*.app" -type d ! -path "*.appex/*" | head -1)
          if [[ -z "${APP_PATH:-}" ]]; then
            echo "ERROR: không tìm thấy .app"
            find "$DERIVED/Build/Products" -maxdepth 4 -type d || true
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          ls -la "$APP_PATH"

          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"

          OUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT_DIR"
          (
            cd "$STAGE"
            zip -r -y "$OUT_DIR/GiaPhaOS-esign.ipa" Payload
          )
          ls -lh "$OUT_DIR/GiaPhaOS-esign.ipa"
          # sanity: IPA phải có binary
          unzip -l "$OUT_DIR/GiaPhaOS-esign.ipa" | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiaPhaOS-esign-ipa
          path: dist/GiaPhaOS-esign.ipa
          if-no-files-found: error
          retention-days: 30
